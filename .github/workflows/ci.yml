name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Native DSP tests
        run: bash scripts/test.sh

      - name: Editor and manual are in step with the C source
        run: python3 scripts/gen_web.py --check

      - name: Editor and manual in a browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          CHROME="$(node -e "console.log(require('playwright').chromium.executablePath())")" node tests/web_test.mjs
